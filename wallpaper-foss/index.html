<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Lockscreen Clock</title>
	<style>
		:root {
			--text-color: #ffffff;
			--panel-bg: rgba(10, 12, 18, 0.55);
			--panel-border: rgba(255, 255, 255, 0.12);
			--shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
			--ui-font: "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
			--clock-font: "SF Pro Rounded", "SF Pro Display", "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
			--time-size: 10vw;
			--date-size: 1.0vw;
			--panel-radius: 20px;
			--date-offset-x: 0px;
			--date-offset-y: 0px;
		}

		/* SF Pro Display removed — using only SF Pro Text (UI) and SF Pro Rounded (clock) */

		* {
			box-sizing: border-box;
			font-family: var(--ui-font);
		}

		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: #000;
			color: var(--text-color);
			font-family: var(--ui-font);
		}

		body {
			display: grid;
			place-items: stretch;
		}

		.stage {
			position: relative;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			background:
				radial-gradient(circle at top left, rgba(255, 255, 255, 0.10), transparent 32%),
				linear-gradient(135deg, #10131f 0%, #1a2436 45%, #0d111a 100%);
		}

		.background {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center center;
			transform: scale(1.01);
			filter: brightness(1.28) saturate(1);
			z-index: 0;
		}

		.foreground {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			object-position: center center;
			transform: scale(1.01);
			filter: url(#foreground-color-adjust);
			z-index: 4;
			pointer-events: none;
			mask-image: radial-gradient(circle at 5% 60%, rgba(0, 0, 0, 0.95) 0 18%, rgba(0, 0, 0, 0.50) 28%, transparent 62%);
			-webkit-mask-image: radial-gradient(rgba(0, 0, 0, 1) 62%, transparent 70%);
		}

		.overlay {
			position: absolute;
			inset: 0;
			background:
				linear-gradient(to top, rgba(0, 0, 0, 0.58) 0%, rgba(0, 0, 0, 0.20) 45%, rgba(0, 0, 0, 0.10) 100%),
				linear-gradient(to right, rgba(0, 0, 0, 0.24), rgba(0, 0, 0, 0.06));
			z-index: 2;
		}

		.gallery {
			position: absolute;
			left: 40%;
			right: 0;
			bottom: 10vh;
			z-index: 1;
			pointer-events: none;
			display: flex;
			justify-content: flex-end;
			align-items: center;
			overflow: hidden;
			padding: 0 clamp(20px, 3vw, 40px);
		}

		.temperature-wrap {
			position: absolute;
			left: clamp(20px, 3vw, 40px);
			bottom: clamp(20px, 3vw, 40px);
			z-index: 3;
			pointer-events: none;
			display: flex;
			align-items: center;
			gap: 0.45em;
			font-size: clamp(16px, 1.8vw, 28px);
			font-weight: 500;
			letter-spacing: 0.02em;
			text-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
			color: rgba(255, 255, 255, 0.92);
		}

		.weather-icon {
			font-size: 1.05em;
			line-height: 1;
		}

		.temperature-value {
			font-variant-numeric: tabular-nums lining-nums;
		}

		.gallery-shell {
			width: min(100%, 960px);
			overflow: hidden;
			mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
			-webkit-mask-image: linear-gradient(to right, transparent 0%, black 8%, black 92%, transparent 100%);
		}

		.gallery-track {
			display: flex;
			width: max-content;
			will-change: transform;
		}

		.gallery-segment {
			display: flex;
			gap: clamp(12px, 1.5vw, 18px);
		}

		.gallery-card {
			width: clamp(88px, 9vw, 150px);
			height: clamp(90px, 9.75vw, 150px);
			border-radius: 18px;
			overflow: hidden;
			background: rgba(255, 255, 255, 0.06);
			box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
			border: 1px solid rgba(255, 255, 255, 0.10);
			flex: 0 0 auto;
		}

		.gallery-card img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			display: block;
		}

		.content {
			position: absolute;
			inset: 0;
			display: grid;
			padding: clamp(20px, 3vw, 40px);
			z-index: 3;
		}

		.clock-wrap {
			max-width: min(192vw, 1100px);
			display: flex;
			flex-direction: column;
			gap: 0.3em;
			align-items: flex-start;
		}

		.clock-time-row {
			display: flex;
			align-items: flex-start;
			gap: 0.18em;
		}

		.clock-main {
			font-family: var(--clock-font);
			font-size: var(--time-size);
			line-height: 0.9;
			font-weight: 700;
			letter-spacing: -0.05em;
			text-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
			font-variant-numeric: tabular-nums lining-nums;
			text-wrap: balance;
		}

		.clock-suffix {
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			justify-content: flex-start;
			padding-top: 0;
			min-width: 0;
		}

		.clock-period {
			font: inherit;
			line-height: 0.9;
			font-weight: 700;
			letter-spacing: -0.05em;
			font-variant-numeric: tabular-nums lining-nums;
		}

		.clock-seconds {
			font-family: var(--ui-font);
			font-size: clamp(13px, 1.15vw, 18px);
			line-height: 1;
			font-weight: 500;
			letter-spacing: 0.03em;
			font-variant-numeric: tabular-nums lining-nums;
			opacity: 0.9;
		}

		.date-wrap {
			max-width: min(192vw, 1100px);
			position: absolute;
			top: clamp(20px, 3vw, 40px);
			left: clamp(20px, 3vw, 40px);
			/* allow shifting the date relative to the anchor via CSS vars */
			transform: translate(var(--date-offset-x), var(--date-offset-y));
			transition: transform 160ms ease;
		}

		.clock {
			display: flex;
		}

		.date {
			margin-top: 0.3em;
			font-size: var(--date-size);
			line-height: 1.2;
			font-weight: 500;
			letter-spacing: 0.02em;
			text-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
			opacity: 0.95;
		}

		.fallback {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			text-align: center;
			color: rgba(255, 255, 255, 0.88);
			font-size: 16px;
			letter-spacing: 0.01em;
			z-index: 0;
		}

		@media (max-width: 860px) {
			.content {
				padding: 16px;
			}

			.clock-wrap {
				align-self: end;
			}

			.clock {
				font-size: clamp(56px, 16vw, 112px);
			}

			.date {
				font-size: clamp(15px, 3.4vw, 29px);
			}
		}
	</style>
</head>
<body>
	<svg aria-hidden="true" width="0" height="0" style="position:absolute;left:-9999px;top:-9999px;overflow:hidden">
		<filter id="foreground-color-adjust" color-interpolation-filters="sRGB">
			<feColorMatrix type="matrix" values="1 0 0 0 -0.04706 0 1 0 0 -0.04706 0 0 1 0 -0.04706 0 0 0 1 0" />
		</filter>
	</svg>
	<main class="stage">
		<img id="backgroundImage" class="background" alt="Lockscreen background" hidden>
		<img id="foregroundImage" class="foreground" alt="Lockscreen foreground overlay" hidden>
		<div class="overlay"></div>

		<section class="content" aria-label="Lockscreen clock preview">
			<div class="clock-wrap" id="clockWrap">
				<div id="clock" class="clock" aria-label="Current time">
					<div class="clock-time-row">
						<div id="clockMain" class="clock-main">00:00</div>
						<div class="clock-suffix" aria-hidden="true">
							<div id="clockPeriod" class="clock-period">AM</div>
							<div id="clockSeconds" class="clock-seconds">00</div>
						</div>
					</div>
				</div>
			</div>
			<div class="temperature-wrap" id="temperatureWrap">
				<div id="weatherIcon" class="weather-icon" aria-hidden="true">--</div>
				<div id="temperature" class="temperature-value">--°</div>
			</div>
			<div class="gallery" aria-hidden="true">
				<div class="gallery-shell">
					<div class="gallery-track" id="galleryTrack">
						<div class="gallery-segment" id="gallerySegment"></div>
						<div class="gallery-segment" id="gallerySegmentClone"></div>
					</div>
				</div>
			</div>
				<div class="date-wrap" id="dateWrap">
					<div id="date" class="date">Loading date...</div>
				</div>
		</section>
	</main>
	<script src="config.js"></script>
	<script type="module">
		const cfg = window.CONFIG || {};
		const basePath = cfg.basePath || '';
		const wallpaperPath = cfg.wallpaperPath || (basePath + (cfg.wallpaper || ''));
		const topOverlayPath = cfg.foregroundPath || (basePath + (cfg.foreground || ''));
		const weatherLocation = cfg.weatherLocation || { latitude: 0, longitude: 0, elevation: 0 };
		const galleryImages = (cfg.galleryImages || []).map((f) => {
			if (typeof f !== 'string') return '';
			if (f.startsWith('http://') || f.startsWith('https://') || f.startsWith('file:///')) return f;
			return basePath + f;
		});

		// fontt
		function joinPath(a, b) {
			if (!a) return b || '';
			if (!b) return a || '';
			return a.replace(/\/+$/,'') + '/' + b.replace(/^\/+/, '');
		}

		const fontBase = (function() {
			if (cfg.fontPath) return cfg.fontPath.endsWith('/') ? cfg.fontPath : cfg.fontPath;
			const bp = basePath || '';
			return joinPath(bp, '');
		})();

		(function injectFonts() {
			const s = document.getElementById('dynamic-fonts') || document.createElement('style');
			s.id = 'dynamic-fonts';
			s.textContent = `@font-face { font-family: "SF Pro Text"; font-style: normal; font-weight: 400; src: url("${fontBase.replace(/\/$/, '')}/SFProText-Regular.ttf"); }
@font-face { font-family: "SF Pro Text"; font-style: normal; font-weight: 500; src: url("${fontBase.replace(/\/$/, '')}/SFProText-Medium.ttf"); }
@font-face { font-family: "SF Pro Text"; font-style: normal; font-weight: 700; src: url("${fontBase.replace(/\/$/, '')}/SFProText-Bold.ttf"); }
`;
			if (!document.getElementById('dynamic-fonts')) document.head.appendChild(s);
		})();

		const config = {
			backgroundImage: wallpaperPath,
			foregroundImage: topOverlayPath,
			uiFont: '"SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, sans-serif',
			clockFont: '"SF Pro Rounded", "SF Pro Display", "SF Pro Text", system-ui, -apple-system, BlinkMacSystemFont, sans-serif',
			timeSize: '10vw',
			dateSize: '1.6vw',
			textColor: '#ffffff',
			overlayStrength: 0.58,
			clockPosition: 'right center',
			datePosition: 'start start',
			dateOffset: { x: '0px', y: '0px' }
		};

		// get the font from the uhhh base path then load it for yes 
		(function injectFonts() {
			const base = basePath || '';
			const s = document.createElement('style');
			s.id = 'dynamic-fonts';
			s.textContent = `
@font-face {
	font-family: "SF Pro Text";
	font-style: normal;
	font-weight: 400;
	src: url("${base}SFProText-Regular.ttf");
}
@font-face {
	font-family: "SF Pro Text";
	font-style: normal;
	font-weight: 500;
	src: url("${base}SFProText-Medium.ttf");
}
@font-face {
	font-family: "SF Pro Text";
	font-style: normal;
	font-weight: 700;
	src: url("${base}SFProText-Bold.ttf");
}
`;
			document.head.appendChild(s);
		})();

		const backgroundImage = document.getElementById('backgroundImage');
		const foregroundImage = document.getElementById('foregroundImage');
		const clockWrap = document.getElementById('clockWrap');
		const dateWrap = document.getElementById('dateWrap');
		const temperatureWrap = document.getElementById('temperatureWrap');
		const weatherIcon = document.getElementById('weatherIcon');
		const temperatureLabel = document.getElementById('temperature');
		const galleryTrack = document.getElementById('galleryTrack');
		const gallerySegment = document.getElementById('gallerySegment');
		const gallerySegmentClone = document.getElementById('gallerySegmentClone');
		const clock = document.getElementById('clock');
		const clockMain = document.getElementById('clockMain');
		const clockPeriod = document.getElementById('clockPeriod');
		const clockSeconds = document.getElementById('clockSeconds');
		const dateLabel = document.getElementById('date');
		const root = document.documentElement;

		function buildGalleryItem(src) {
			const card = document.createElement('div');
			card.className = 'gallery-card';
			const img = document.createElement('img');
			img.src = src;
			img.alt = '';
			img.loading = 'lazy';
			card.appendChild(img);
			return card;
		}

		function populateGallery() {
			if (!gallerySegment || !gallerySegmentClone) return;
			gallerySegment.textContent = '';
			gallerySegmentClone.textContent = '';
			galleryImages.forEach((src) => {
				gallerySegment.appendChild(buildGalleryItem(src));
				gallerySegmentClone.appendChild(buildGalleryItem(src));
			});
		}

		function formatTime(date) {
			const parts = new Intl.DateTimeFormat(undefined, {
				hour: 'numeric',
				minute: '2-digit',
				second: '2-digit',
				hour12: true
			}).formatToParts(date);
			const hour = parts.find((part) => part.type === 'hour')?.value ?? '00';
			const minute = parts.find((part) => part.type === 'minute')?.value ?? '00';
			const second = parts.find((part) => part.type === 'second')?.value ?? '00';
			const dayPeriod = parts.find((part) => part.type === 'dayPeriod')?.value ?? '';
			return { hourMinute: `${hour}:${minute}`, second, dayPeriod };
		}

		function formatDate(date) {
			return new Intl.DateTimeFormat(undefined, {
				weekday: 'long',
				month: 'long',
				day: 'numeric'
			}).format(date);
		}

		function getWeatherIcon(weatherCode) {
			if (weatherCode === 0) return '☀';
			if (weatherCode === 1) return '🌤';
			if (weatherCode === 2) return '⛅';
			if (weatherCode === 3) return '☁';
			if (weatherCode === 45 || weatherCode === 48) return '🌫';
			if (weatherCode >= 51 && weatherCode <= 57) return '🌦';
			if (weatherCode >= 61 && weatherCode <= 67) return '🌧';
			if (weatherCode >= 71 && weatherCode <= 77) return '🌨';
			if (weatherCode >= 80 && weatherCode <= 82) return '🌦';
			if (weatherCode >= 85 && weatherCode <= 86) return '🌨';
			if (weatherCode >= 95 && weatherCode <= 99) return '⛈';
			return '◌';
		}

		function updateClock() {
			const now = new Date();
			const time = formatTime(now);
			if (clockMain) clockMain.textContent = time.hourMinute;
			if (clockPeriod) clockPeriod.textContent = time.dayPeriod;
			if (clockSeconds) clockSeconds.textContent = time.second;
			dateLabel.textContent = formatDate(now);
		}

		async function updateTemperature() {
			if (!temperatureLabel || !weatherIcon) return;

			try {
				const params = new URLSearchParams({
					latitude: String(weatherLocation.latitude),
					longitude: String(weatherLocation.longitude),
					current: 'temperature_2m,weather_code',
					temperature_unit: 'fahrenheit',
					timezone: 'auto'
				});

				if (weatherLocation.elevation !== undefined) {
					params.set('elevation', String(weatherLocation.elevation));
				}

				const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params.toString()}`);
				if (!response.ok) throw new Error(`Open-Meteo request failed: ${response.status}`);
				const data = await response.json();
				const temp = data?.current?.temperature_2m;
				const weatherCode = data?.current?.weather_code;
				if (typeof temp === 'number') {
					temperatureLabel.textContent = `${Math.round(temp)}°`;
				}
				if (typeof weatherCode === 'number') {
					weatherIcon.textContent = getWeatherIcon(weatherCode);
				}
			} catch (error) {
				weatherIcon.textContent = '--';
				temperatureLabel.textContent = '--°';
				console.warn('Temperature load failed:', error);
			}
		}

		function applyConfig() {
			root.style.setProperty('--clock-font', config.clockFont);
			root.style.setProperty('--ui-font', config.uiFont);
			root.style.setProperty('--time-size', config.timeSize);
			root.style.setProperty('--date-size', config.dateSize);
			root.style.setProperty('--date-offset-x', (config.dateOffset && config.dateOffset.x) || '0px');
			root.style.setProperty('--date-offset-y', (config.dateOffset && config.dateOffset.y) || '0px');
			root.style.setProperty('--text-color', config.textColor);

			const overlay = document.querySelector('.overlay');
			const topStrength = Math.min(0.82, config.overlayStrength);
			const rightStrength = Math.max(0.05, config.overlayStrength * 0.35);
			overlay.style.background = `linear-gradient(to top, rgba(0, 0, 0, ${topStrength}) 0%, rgba(0, 0, 0, 0.20) 45%, rgba(0, 0, 0, 0.10) 100%), linear-gradient(to right, rgba(0, 0, 0, ${rightStrength}), rgba(0, 0, 0, 0.06))`;

			const [justifySelf, alignSelf] = config.clockPosition.split(' ');
			clockWrap.style.justifySelf = justifySelf;
			clockWrap.style.alignSelf = alignSelf;

			if (config.datePosition) {
				const [dateJustifySelf, dateAlignSelf] = config.datePosition.split(' ');
				dateWrap.style.justifySelf = dateJustifySelf;
				dateWrap.style.alignSelf = dateAlignSelf;
			}

			if (config.backgroundImage) {
				backgroundImage.src = config.backgroundImage;
				backgroundImage.hidden = false;
			}

			if (config.foregroundImage) {
				foregroundImage.src = config.foregroundImage;
				foregroundImage.hidden = false;
			}

			populateGallery();
			updateTemperature();
		}

		(async function init() {
			let fontLoaded = true;
			if (fontLoaded && document.fonts && typeof document.fonts.load === 'function') {
				try {
					const famA = 'SF Pro Text';
					const famC = 'SF Pro Rounded';
					const loads = [
						document.fonts.load('700 1em "' + famC + '"'),
						document.fonts.load('500 1em "' + famA + '"'),
						document.fonts.load('400 1em "' + famA + '"')
					];
					await Promise.race([Promise.all(loads), new Promise(res => setTimeout(res, 1500))]);
				} catch (e) {
				
				}
			}

			applyConfig();
			updateClock();
			updateTemperature();

			let galleryOffset = 0;
			let galleryLastTime = performance.now();
			let gallerySpeed = 0.04;

			function animateGallery(now) {
				const segmentWidth = gallerySegment?.scrollWidth ?? 0;
				const delta = now - galleryLastTime;
				galleryLastTime = now;

				if (segmentWidth > 0 && galleryTrack) {
					galleryOffset = (galleryOffset + delta * gallerySpeed) % segmentWidth;
					galleryTrack.style.transform = `translate3d(${-galleryOffset}px, 0, 0)`;
				}

				requestAnimationFrame(animateGallery);
			}

			requestAnimationFrame(animateGallery);
			setInterval(updateClock, 1000);
			// get temps every 5 minutes locked
			setInterval(updateTemperature, 300000);
		})();
	</script>
</body>
</html>
